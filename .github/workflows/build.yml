name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # گوشی‌های معمولی: armeabi-v7a (قدیمی) + arm64-v8a (جدید)
          - name: arm
            platforms: android-arm,android-arm64
          # فقط شبیه‌ساز و دستگاه‌های اینتلی
          - name: x86_64
            platforms: android-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Convert logo.webp to PNG for launcher icon
        run: |
          sudo apt-get update -y && sudo apt-get install -y webp
          dwebp assets/logo.webp -o assets/logo_icon.png

      - name: Generate launcher icon (از assets/logo_icon.png)
        run: dart run flutter_launcher_icons

      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew wrapper files
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      # هر دو APK باید با همان کلید دیجیتال داخل Secrets امضا شوند.
      # اگر Secrets تنظیم نشده باشد، بیلد عمداً متوقف می‌شود تا APK با کلید دیباگ ساخته نشود.
      - name: Setup signing (کلید دیجیتال از Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::یکی از Secrets کلید دیجیتال (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) تنظیم نشده است."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=keystore.jks\n'
          } > android/key.properties
          echo "Signing configured."

      - name: Build release APK (${{ matrix.name }})
        run: flutter build apk --release --target-platform ${{ matrix.platforms }} --split-debug-info=build/symbols/${{ matrix.name }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/soore-saffat-${{ matrix.name }}.apk

      - name: APK report (حجم و اثر انگشت کلید دیجیتال)
        continue-on-error: true
        run: |
          ls -l build/soore-saffat-${{ matrix.name }}.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "apksigner not found"; exit 0; fi
          "$APKSIGNER" verify --print-certs build/soore-saffat-${{ matrix.name }}.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soore-saffat-${{ matrix.name }}-apk
          path: build/soore-saffat-${{ matrix.name }}.apk
